name: Build Docker rust-musl-builder

on:
  schedule:
    - cron: '00 22 * * *'
  push:
    paths:
      - 'rust-musl-builder/**'
      - '.github/workflows/docker-rust-musl-builder.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build_builder:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@main
    - name: Resolve image tags
      run: |
        set -euo pipefail
        . ./rust-musl-builder/versions.env
        TC_IMAGE=$(bash ./rust-musl-builder/toolchain-image.sh)
        if [ -z "$TC_IMAGE" ]; then
          echo "toolchain-image.sh produced no output" >&2
          exit 1
        fi
        echo "resolved toolchain image: $TC_IMAGE"
        echo "TC_IMAGE=$TC_IMAGE" >> $GITHUB_ENV
        echo "TC_TAG=gcc${GCC_VER}-musl${MUSL_VER}" >> $GITHUB_ENV
    - name: Free disk space
      # Two GCC source trees plus a kernel tree plus two build trees do not fit
      # alongside the runner's preinstalled toolchains.
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        df -h /
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@master
    - name: Login to Docker Hub
      uses: docker/login-action@master
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build toolchain image if this recipe has not been published
      run: |
        set -euo pipefail
        if docker buildx imagetools inspect "$TC_IMAGE" >/dev/null 2>&1; then
          echo "toolchain already published, reusing: $TC_IMAGE"
        else
          echo "no published toolchain for this recipe, building: $TC_IMAGE"
          docker buildx build --push \
            --platform linux/amd64 \
            -f rust-musl-builder/Dockerfile.toolchain \
            -t "$TC_IMAGE" \
            rust-musl-builder
        fi
    - name: Build and push
      uses: docker/build-push-action@master
      with:
        context: "./rust-musl-builder"
        push: true
        platforms: linux/amd64
        build-args: |
          TOOLCHAIN_IMAGE=${{ env.TC_IMAGE }}
        tags: |
          sliamb/rust-musl-builder:latest
          sliamb/rust-musl-builder:${{ env.TC_TAG }}
        # image-manifest/oci-mediatypes are what make Docker Hub accept a cache
        # manifest; without them the push of the cache blob is rejected.
        cache-from: type=registry,ref=sliamb/rust-musl-builder:buildcache
        cache-to: type=registry,ref=sliamb/rust-musl-builder:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
    - name: Verify published image
      # The in-image smoke test already ran during the build; this confirms the
      # thing that was actually pushed is the thing that passed it.
      run: |
        docker run --rm sliamb/rust-musl-builder:latest musl-builder-smoke-test
        docker run --rm sliamb/rust-musl-builder:latest cat /etc/rust-musl-builder-versions
