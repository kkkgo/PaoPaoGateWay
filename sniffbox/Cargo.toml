[workspace]
resolver = "3"
members = [
    "crates/sniffbox",
    "crates/sb-tproxy",
    "crates/sb-sniff",
    "crates/sb-outbound",
    "crates/sb-stats",
    "crates/sb-dns",
    "crates/sb-web",
    "crates/sb-ppgw",
]

exclude = [
    "crates/sb-sniff/fuzz",
]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
license      = "GPL-3.0-only"
authors      = ["blog.03k.org"]
repository   = "https://github.com/kkkgo/PaoPaoGateWay"

[workspace.dependencies]

tokio        = { version = "1", features = ["net", "io-util", "sync", "time", "signal", "macros", "rt-multi-thread", "fs"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

nix      = { version = "0.31", features = ["net"] }
socket2  = { version = "0.6", features = ["all"] }
libc     = "0.2"

bytes           = "1"
httparse        = "1"
sha2            = "0.11"
hex             = "0.4"
crossbeam-utils = "0.8"
dashmap         = "6"
parking_lot     = "0.13"
tempfile        = "3"
time            = { version = "0.3", features = ["formatting", "macros"] }
thiserror       = "2"
arc-swap        = "1"
ipnet           = "2"

yaml-rust2      = "0.13"

wreq            = { version = "=6.0.0-rc.31", default-features = false, features = ["tokio-rt", "socks", "gzip", "brotli", "deflate", "zstd", "stream"] }

wreq-util       = { version = "=3.0.0-rc.14", default-features = false, features = ["emulation"] }

regex-lite      = "0.1"

btls            = "0.5"
tokio-btls      = "0.5"

chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }

criterion       = { version = "0.8", default-features = false, features = ["cargo_bench_support", "async_tokio"] }

sb-tproxy   = { path = "crates/sb-tproxy" }
sb-sniff    = { path = "crates/sb-sniff" }
sb-outbound = { path = "crates/sb-outbound" }
sb-stats    = { path = "crates/sb-stats" }
sb-dns      = { path = "crates/sb-dns" }
sb-web      = { path = "crates/sb-web" }
sb-ppgw     = { path = "crates/sb-ppgw" }

[profile.release]
lto           = "fat"
codegen-units = 1
strip         = true
panic         = "abort"

[profile.release-small]
inherits  = "release"
opt-level = "z"

[profile.release-small.package]
sb-sniff         = { opt-level = 3 }
sb-dns           = { opt-level = 3 }
sb-tproxy        = { opt-level = 3 }
sb-stats         = { opt-level = 3 }
sb-outbound      = { opt-level = 3 }
aes              = { opt-level = 3 }
aes-gcm          = { opt-level = 3 }
ghash            = { opt-level = 3 }
polyval          = { opt-level = 3 }
sha2             = { opt-level = 3 }
hkdf             = { opt-level = 3 }
hmac             = { opt-level = 3 }
cipher           = { opt-level = 3 }
universal-hash   = { opt-level = 3 }
chacha20poly1305 = { opt-level = 3 }
chacha20         = { opt-level = 3 }
